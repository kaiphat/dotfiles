gui:
  sidePanelWidth: 0.4
  commitLength:
    show: false
  showListFooter: false
  showRandomTip: false
  showBottomLine: false
  showCommandLog: false
  showPanelJumps: false
  # border: 'rounded'
  border: 'hidden'
  filterMode: 'fuzzy'
  # mainPanelSplitMode: 'flexible'

git:
  diffRenderers:
    - command: delta --dark --paging=never
    - command: ydiff -p cat
      colorArg: never
    - type: extDiff
      command: difft --color=always --context={{diffContext}}
    - type: rawGit
      args: --color-words
      name: color-words
    - type: rawGit # git's default diff
      name: default

  # colorArg: always
  # # pager: diff-so-fancy
  # # externalDiffCommand: difft --color=always --display=side-by-side-show-both --syntax-highlight=on
  # # pager: delta --dark --paging=never
  # externalDiffCommand: 'delta --dark --paging=never --line-numbers --hyperlinks --hunk-header-style="syntax bold box" --hunk-header-decoration-style="blue box"'

promptToReturnFromSubprocess: false

os:
  # editPreset: nvim
  edit: "nu ~/dotfiles/scripts/open-lazygit-in-neovim.nu {{filename}}"
  editAtLine: "nu ~/dotfiles/scripts/open-lazygit-in-neovim.nu {{filename}} {{line}}"
  editAtLineAndWait: ""
  editInTerminal: true
  # open isn't working for nvim, idk why, so just to use edit command in any case
  # open: nu ~/dotfiles/scripts/open-lazygit-in-neovim.nu {{filename}}

customCommands:
  - key: 'D'
    # command: 'fish -c "git diff origin/master...{{.SelectedLocalBranch.Name}} | difft"'
    command: "git difftool -y {{.SelectedLocalCommit.Sha}} -- {{.SelectedCommitFile.Name}}"
    # context: 'localBranches'
    context: 'commitFiles'
    description: 'Diff with master'
    # subprocess: true
